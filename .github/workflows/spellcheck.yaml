---
name: "Spellcheck"
"on":
  push:
    branches: ["main"]
  pull_request:

jobs:
  check-spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Spelling
        uses: rojopolis/spellcheck-github-actions@0.65.0
        with:
          config_path: .spellcheck.yaml
          task_name: Markdown
